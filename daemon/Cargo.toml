[package]
name = "fs25-ffb"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Force-feedback enhancer daemon and GUI for Farming Simulator 25 on Linux"
license = "MIT"
repository = "https://github.com/RobinNotHood/Farming-Simulator-25---FFB-Mod-Linux"

[[bin]]
name = "fs25-ffb"
path = "src/main.rs"

[dependencies]
# GUI
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.27"
egui_plot = "0.27"

# FFB / input
evdev = "0.12"
input-linux = "0.7"
nix = { version = "0.28", features = ["fs", "ioctl"] }

# Filesystem watch
notify = "6"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
anyhow = "1"
thiserror = "1"
once_cell = "1"
crossbeam-channel = "0.5"
directories = "5"
byteorder = "1"
parking_lot = "0.12"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
