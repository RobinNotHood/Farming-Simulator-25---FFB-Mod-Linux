name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (eframe)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libglib2.0-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        if: matrix.toolchain == 'stable'
        with:
          name: fs25-ffb-linux-x86_64
          path: daemon/target/release/fs25-ffb
          if-no-files-found: error

  mod:
    name: Lua mod lint + zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build mod zip
        run: |
          mkdir -p dist
          cd mod
          zip -qr "../dist/FS25_FFBEnhancer.zip" FS25_FFBEnhancer \
            -x "*.dds.README"

      - name: Upload mod zip
        uses: actions/upload-artifact@v4
        with:
          name: FS25_FFBEnhancer
          path: dist/FS25_FFBEnhancer.zip
          if-no-files-found: error
